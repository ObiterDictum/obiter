# Local development database for Obiter.
#
# Matches the API's defaults in services/api/src/env.ts:
#   DATABASE_URL        = postgres://ormont:ormont@localhost:5432/ormont
#   TEST_DATABASE_URL   = postgres://ormont:ormont@localhost:5432/ormont_test
#
# Usage:
#   docker compose up -d
#   # then run migrations against both databases (see infra/docker/README.md)
#   pnpm dev:api
#
# The init script creates the ormont_test database on first boot (empty volume).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ormont-postgres
    environment:
      POSTGRES_USER: ormont
      POSTGRES_PASSWORD: ormont
      POSTGRES_DB: ormont
    ports:
      - "5432:5432"
    volumes:
      - ormont_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ormont -d ormont"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ormont_pg_data:
