# Local development database for Obiter.
#
# Matches the API's defaults in services/api/src/env.ts:
#   DATABASE_URL        = postgres://obiter:obiter@localhost:5432/obiter
#   TEST_DATABASE_URL   = postgres://obiter:obiter@localhost:5432/obiter_test
#
# Usage:
#   docker compose up -d
#   # then run migrations against both databases (see infra/docker/README.md)
#   pnpm dev:api
#
# The init script creates the obiter_test database on first boot (empty volume).
services:
  postgres:
    image: postgres:16-alpine
    container_name: obiter-postgres
    environment:
      POSTGRES_USER: obiter
      POSTGRES_PASSWORD: obiter
      POSTGRES_DB: obiter
    ports:
      - '5432:5432'
    volumes:
      - obiter_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U obiter -d obiter']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  obiter_pg_data:
