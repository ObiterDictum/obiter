name: CI

on:
  # Deliberately unfiltered by base branch. Stacked PRs target the branch below
  # them rather than dev, so a `branches:` filter here silently gives every
  # stacked PR no CI at all.
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, format, lint, test
    runs-on: ubuntu-latest
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/.github/fontconfig-liberation.conf
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.53.1
        env:
          MEILI_MASTER_KEY: obiter-local-dev-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: obiter
          POSTGRES_PASSWORD: obiter
          POSTGRES_DB: obiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obiter -d obiter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Runner forensics for the pdf-glyph-layout flake (two stable outcomes,
      # alternating per run): GitHub mixes CPU generations in the pool and a
      # rendering path that differs by instruction set would produce exactly
      # that. Early and unconditional so failing runs always carry it.
      - name: Runner diagnostics
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "runner.os=${{ runner.os }}"
          echo "RUNNER_NAME=$RUNNER_NAME"
          uname -a
          lscpu || cat /proc/cpuinfo

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Prettier formatting — rejects unformatted code. Keeps the tree free of
      # formatter churn (no agent's prettier run should ever produce a diff).
      - name: Format check
        run: pnpm format:check

      # Two-stage lint: oxlint (fast correctness pass) then eslint (owns the
      # icon-pack no-restricted-imports ban and the hex-color-in-styles rule).
      - name: Lint
        run: pnpm lint

      - name: Apply database migrations
        env:
          PGPASSWORD: obiter
        run: |
          # fontconfig + Liberation match scripts/ci-local.sh: pdf.js maps
          # base-14 fonts to them, and pdf-glyph-layout.test.ts measures cover
          # against rendered ink. Without them the runner substitutes a different
          # face and the contain checks fail by fractions of a point.
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client fontconfig fonts-liberation
          mkdir -p /tmp/obiter-fontconfig-cache
          fc-cache -f
          LIBERATION=$(fc-list 2>/dev/null | grep -ci liberation || true)
          if ! command -v fc-list >/dev/null 2>&1 || [ "${LIBERATION:-0}" -eq 0 ]; then
            echo "Liberation fonts did not resolve after install (fontconfig / fonts-liberation)." >&2
            echo "pdf.js will substitute a different face and pdf-glyph-layout.test.ts will fail by covering less ink than it should." >&2
            echo "fc-list | grep -i liberation is empty. Install the packages, then run: fc-cache -f with FONTCONFIG_FILE=.github/fontconfig-liberation.conf" >&2
            echo "fc-match Times: $(fc-match Times 2>/dev/null || true)" >&2
            echo "fc-match 'Times New Roman': $(fc-match 'Times New Roman' 2>/dev/null || true)" >&2
            echo "fc-match Helvetica: $(fc-match Helvetica 2>/dev/null || true)" >&2
            echo "fc-match Courier: $(fc-match Courier 2>/dev/null || true)" >&2
            exit 1
          fi
          echo "fc-match Times: $(fc-match Times)"
          echo "fc-match Times New Roman: $(fc-match 'Times New Roman')"
          echo "fc-match Times-Roman: $(fc-match Times-Roman)"
          echo "fc-match Liberation Serif: $(fc-match 'Liberation Serif')"
          echo "fc-match Helvetica: $(fc-match Helvetica)"
          echo "fc-match Courier: $(fc-match Courier)"
          TIMES_MATCH=$(fc-match Times)
          TNR_MATCH=$(fc-match 'Times New Roman')
          if ! printf '%s' "$TIMES_MATCH" | grep -qi 'Liberation Serif' || ! printf '%s' "$TNR_MATCH" | grep -qi 'Liberation Serif'; then
            echo "Times / Times New Roman must resolve to Liberation Serif (pdf.js local() order)." >&2
            echo "Times: $TIMES_MATCH" >&2
            echo "Times New Roman: $TNR_MATCH" >&2
            exit 1
          fi
          for f in packages/database/migrations/*.sql; do
            psql -h localhost -U obiter -d obiter_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://obiter:obiter@localhost:5432/obiter_test
        run: pnpm test

      - name: Search correctness benchmark
        env:
          SEARCH_BENCHMARK_API_KEY: obiter-local-dev-key
          SEARCH_BENCHMARK_HOST: http://127.0.0.1:7700
          SEARCH_BENCHMARK_REPORT_PATH: ${{ runner.temp }}/search-benchmark.json
        run: pnpm benchmark:search

      - name: Upload search benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-correctness-benchmark
          path: ${{ runner.temp }}/search-benchmark.json
          if-no-files-found: ignore

  # Deployable images build only on pushes to main (the release branch).
  # dev is the integration branch; promote dev -> main to cut a deploy.
  #
  # Currently only the web app has a Dockerfile. The API image is deferred
  # (docs/specs/deployment.md); add a docker-api job here when its Dockerfile
  # lands. Marketing lives in its own repo; desktop ships as Electron
  # installers, not server images.
  docker-web:
    name: Build web image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Context is the repo root — the web Dockerfile's COPY paths span the
      # workspace, and the root .dockerignore (with its .env* exclusions) only
      # applies at the context root. See docs/specs/deployment.md.
      - name: Build apps/web image
        run: docker build -f apps/web/Dockerfile -t obiter-web:ci .
