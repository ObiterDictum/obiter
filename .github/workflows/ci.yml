name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, format, lint, test
    runs-on: ubuntu-latest
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.12.0
        env:
          MEILI_MASTER_KEY: search-benchmark-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Prettier formatting — rejects unformatted code. Keeps the tree free of
      # formatter churn (no agent's prettier run should ever produce a diff).
      - name: Format check
        run: pnpm format:check

      # Two-stage lint: oxlint (fast correctness pass) then eslint (owns the
      # icon-pack no-restricted-imports ban and the hex-color-in-styles rule).
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Search correctness benchmark
        env:
          SEARCH_BENCHMARK_API_KEY: search-benchmark-key
          SEARCH_BENCHMARK_HOST: http://127.0.0.1:7700
          SEARCH_BENCHMARK_REPORT_PATH: ${{ runner.temp }}/search-benchmark.json
          SEARCH_BENCHMARK_KEEP_INDEX: '1'
        run: pnpm benchmark:search

      - name: Curl search benchmark queries
        env:
          SEARCH_BENCHMARK_API_KEY: search-benchmark-key
          SEARCH_BENCHMARK_HOST: http://127.0.0.1:7700
          SEARCH_BENCHMARK_REPORT_PATH: ${{ runner.temp }}/search-benchmark.json
        run: pnpm tsx packages/search-client/src/benchmark/curl.ts

      - name: Upload search benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-correctness-benchmark
          path: ${{ runner.temp }}/search-benchmark.json
          if-no-files-found: ignore

  # Deployable images build only on pushes to main (the release branch).
  # dev is the integration branch; promote dev -> main to cut a deploy.
  #
  # Currently only the web app has a Dockerfile. The API image is deferred
  # (docs/specs/deployment.md); add a docker-api job here when its Dockerfile
  # lands. Marketing lives in its own repo; desktop ships as Electron
  # installers, not server images.
  docker-web:
    name: Build web image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Context is the repo root — the web Dockerfile's COPY paths span the
      # workspace, and the root .dockerignore (with its .env* exclusions) only
      # applies at the context root. See docs/specs/deployment.md.
      - name: Build apps/web image
        run: docker build -f apps/web/Dockerfile -t obiter-web:ci .
