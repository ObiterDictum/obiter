name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  docker-web:
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Context is the repo root — the web Dockerfile's COPY paths span the
      # workspace, and the root .dockerignore (with its .env* exclusions) only
      # applies at the context root. See docs/specs/deployment.md.
      - name: Build apps/web image
        run: docker build -f apps/web/Dockerfile -t obiter-web:ci .
