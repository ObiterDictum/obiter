name: CI

# Minimal token permissions: nothing here writes to the repository. This also
# answers the CodeQL "Workflow does not contain permissions" finding raised on
# this pull request's workflow changes.
permissions:
  contents: read

on:
  # Deliberately unfiltered by base branch. Stacked PRs target the branch below
  # them rather than dev, so a `branches:` filter here silently gives every
  # stacked PR no CI at all.
  pull_request:
  push:
    branches: [main]

# The API, the case-law packages and the database migrations live in the
# private ObiterDictum/backend repository, and their CI runs there: Postgres
# and Meilisearch services, the migration run, the search benchmark, the Bun
# API runtime integration, the web end-to-end suite and the API images. See
# docs/backend-repo-split.md.
jobs:
  checks:
    name: Typecheck, format, lint, test
    runs-on: ubuntu-latest
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/.github/fontconfig-liberation.conf
    steps:
      - uses: actions/checkout@v4

      # Bun is the toolchain: setup-bun provides the pinned runtime from
      # .bun-version, and every gate below runs with `bun --bun run` so the
      # scripts themselves execute on Bun. Node stays installed because
      # third-party package lifecycle scripts run it (esbuild's postinstall).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # bun has no cache flag in setup-bun; cache its download store keyed on
      # the lockfile so a warm run skips re-downloading the workspace graph.
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --bun run typecheck

      # Prettier formatting — rejects unformatted code. Keeps the tree free of
      # formatter churn (no agent's prettier run should ever produce a diff).
      - name: Format check
        run: bun --bun run format:check

      # Two-stage lint: oxlint (fast correctness pass) then eslint (owns the
      # icon-pack no-restricted-imports ban and the hex-color-in-styles rule).
      - name: Lint
        run: bun --bun run lint

      # `bun run lint` already includes this guard; it runs again here so a
      # failure names the private backend boundary rather than reading as a
      # lint rule. Server-private code belongs in ObiterDictum/backend.
      - name: Reject private backend paths and imports
        run: bun scripts/lint/check-private-paths.mjs

      # The web production build is a gate of its own: TanStack Start's
      # import-protection plugin only rejects a server-only import reaching
      # client code while building, so the failure typechecks, formats, lints
      # and tests clean (#121 did exactly that on 29 August and every PR since
      # merged green). Keep it in this job so it stays part of the required
      # check rather than a separate workflow someone has to remember.
      - name: Build web
        run: bun --bun run --filter @obiter/web build

      # Deterministic bundle budget over the build output the step above just
      # produced: the files the root route preloads on every page, and the lazy
      # chunks. Measured budgets with documented headroom; see
      # scripts/perf/bundle-budget.mjs for what is counted.
      - name: Bundle budget
        run: bun --bun run perf:bundle-budget

      # The build wrote dist/.obiter-build.json. Verify it names this commit and
      # a production React build, so a marker that silently rots fails here
      # rather than at measurement time.
      - name: Build provenance
        run: bun apps/web/build-provenance.mjs verify --expect-commit "$GITHUB_SHA" --allow-dirty

      # Desktop had the same gap P1.32 had for web: electron-vite build ran only
      # on push to main, so a broken desktop entry point could merge green. The
      # budget below needs the build on every PR anyway, and the build resolves
      # the Electron package the frozen-lockfile install already fetched, so it
      # adds no dependency install of its own.
      - name: Build desktop
        run: bun --bun run --filter @obiter/desktop build

      # Deterministic desktop size budget over that build: the initial renderer
      # graph, lazy chunks and largest lazy chunk, the PDF worker, product font
      # assets, main/preload, and the application payload the packager reads.
      # Raw bytes, not gzip: the packaged renderer is read from the local asar
      # over obiter://, never downloaded. See scripts/perf/desktop-budget.mjs.
      - name: Desktop budget
        run: bun --bun run perf:desktop-budget

      # fontconfig + Liberation match scripts/ci-local.sh: pdf.js maps base-14
      # fonts to them, and the renderer's PDF tests measure cover against
      # rendered ink. Without them the runner substitutes a different face and
      # the contain checks fail by fractions of a point.
      - name: Install font packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig fonts-liberation
          mkdir -p /tmp/obiter-fontconfig-cache
          fc-cache -f
          LIBERATION=$(fc-list 2>/dev/null | grep -ci liberation || true)
          if ! command -v fc-list >/dev/null 2>&1 || [ "${LIBERATION:-0}" -eq 0 ]; then
            echo "Liberation fonts did not resolve after install (fontconfig / fonts-liberation)." >&2
            echo "pdf.js will substitute a different face and the PDF cover checks will fail by covering less ink than they should." >&2
            echo "fc-list | grep -i liberation is empty. Install the packages, then run: fc-cache -f with FONTCONFIG_FILE=.github/fontconfig-liberation.conf" >&2
            echo "fc-match Times: $(fc-match Times 2>/dev/null || true)" >&2
            echo "fc-match 'Times New Roman': $(fc-match 'Times New Roman' 2>/dev/null || true)" >&2
            exit 1
          fi
          echo "fc-match Times: $(fc-match Times)"
          echo "fc-match Times New Roman: $(fc-match 'Times New Roman')"
          echo "fc-match Liberation Serif: $(fc-match 'Liberation Serif')"
          TIMES_MATCH=$(fc-match Times)
          TNR_MATCH=$(fc-match 'Times New Roman')
          if ! printf '%s' "$TIMES_MATCH" | grep -qi 'Liberation Serif' || ! printf '%s' "$TNR_MATCH" | grep -qi 'Liberation Serif'; then
            echo "Times / Times New Roman must resolve to Liberation Serif (pdf.js local() order)." >&2
            echo "Times: $TIMES_MATCH" >&2
            echo "Times New Roman: $TNR_MATCH" >&2
            exit 1
          fi

      # The redaction-renderer suite launches the Playwright Chromium it ships
      # against. Playwright fetches browsers on demand, not during install, so
      # without this step the worker's real-render tests have no browser.
      - name: Install Playwright Chromium
        run: bun --bun playwright install --with-deps chromium

      - name: Test
        run: bun run test

  # Deployable image builds only on pushes to main (the release branch).
  # dev is the integration branch; promote dev -> main to cut a deploy.
  # Only the web image builds here now: the API images build from the private
  # backend repository, which owns services/api/Dockerfile and both adapters.
  # Marketing lives in its own repo; desktop ships as Electron installers, not
  # server images.
  docker-web:
    name: Build web image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Context is the repo root — the web Dockerfile's COPY paths span the
      # workspace, and the root .dockerignore (with its .env* exclusions) only
      # applies at the context root. See docs/specs/deployment.md.
      - name: Build apps/web image
        # Pass the checked-out commit and a truthful clean flag so the image's
        # dist/.obiter-build.json names the artifact it was built from. Without
        # these the marker records commit:null and no deployed image can ever
        # satisfy the measurement harness's --expect-artifact-commit.
        # GITHUB_SHA is the pushed commit and the Actions checkout is clean, so
        # OBITER_BUILD_DIRTY=0. See docs/specs/deployment.md.
        run: |
          docker build -f apps/web/Dockerfile -t obiter-web:ci \
            --build-arg OBITER_BUILD_COMMIT="$GITHUB_SHA" \
            --build-arg OBITER_BUILD_DIRTY=0 \
            .
