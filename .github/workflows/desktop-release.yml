name: Desktop release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Bun installs and runs the workspace scripts; Node hosts electron's
      # install script and electron-builder during packaging.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the desktop app (electron-vite) and packages the NSIS installer.
      # The model is not bundled (server-side inference); see
      # docs/specs/desktop-release.md.
      - name: Build Windows installer
        run: bun run --filter @obiter/desktop package:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: obiter-windows-installer
          # electron-builder output (electron-builder.yml directories.output).
          path: |
            apps/desktop/release/Obiter-Setup-*.exe
            apps/desktop/release/Obiter-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release for a new version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="desktop-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; bump apps/desktop/package.json to publish a new release."
            exit 0
          fi
          gh release create "$tag" \
            "apps/desktop/release/Obiter-Setup-$version.exe" \
            "apps/desktop/release/Obiter-Setup-$version.exe.blockmap" \
            apps/desktop/release/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Obiter desktop $version" \
            --latest \
            --notes "Windows installer for Obiter $version, built from $GITHUB_SHA. The installer is not code-signed yet, so Windows SmartScreen asks you to confirm before it runs: choose More info, then Run anyway."
