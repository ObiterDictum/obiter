<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- CI only: pdf.js walks local(Times New Roman), local(Times), … before
       Liberation Serif. A second installed serif (DejaVu, Nimbus, Ubuntu)
       makes cover vs ink discrete-flip. This file is the only fontconfig
       the test job sees. -->
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir>/tmp/obiter-fontconfig-cache</cachedir>
</fontconfig>
